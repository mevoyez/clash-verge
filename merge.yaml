proxy-groups:

  # 自动选择
  - name: "自动选择"
    type: "url-test"
    include-all: true
    exclude-type: "DIRECT|Reject"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 2
    hidden: true
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/speed.svg"


  # 故障转移
  - name: "故障转移"
    type: "fallback"
    include-all: true
    exclude-type: "DIRECT|Reject"
    interval: 300
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 3
    hidden: true
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/ambulance.svg"


  # 香港节点
  - name: "香港节点"
    type: "url-test"
    include-all: true
    filter: "(?i)香港|HK|Hong Kong|HKG|🇭🇰"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 2
    hidden: true


  # 台湾节点
  - name: "台湾节点"
    type: "url-test"
    include-all: true
    filter: "(?i)台湾|台灣|Taiwan|TW|TWN|🇹🇼"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 2
    hidden: true


  # 日本节点
  - name: "日本节点"
    type: "url-test"
    include-all: true
    filter: "(?i)日本|JP|Japan|Tokyo|Osaka|🇯🇵"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 2
    hidden: true


  # 新加坡节点
  - name: "新加坡节点"
    type: "url-test"
    include-all: true
    filter: "(?i)新加坡|SG|Singapore|🇸🇬"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 2
    hidden: true


  # 美国节点
  - name: "美国节点"
    type: "url-test"
    include-all: true
    filter: "(?i)美国|US|USA|United States|America|🇺🇸"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    lazy: false
    max-failed-times: 2
    hidden: true


  # 节点选择
  - name: "节点选择"
    type: "select"
    proxies:
      - "自动选择"
      - "故障转移"
      - "香港节点"
      - "台湾节点"
      - "日本节点"
      - "新加坡节点"
      - "美国节点"
    include-all: false
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg"


  # Spotify
  - name: "Spotify"
    type: "select"
    proxies:
      - "DIRECT"
      - "节点选择"
      - "自动选择"
    include-all: true
    interval: 300
    timeout: 3000
    url: "https://www.google.com/generate_204"
    lazy: true
    max-failed-times: 3
    hidden: false
    icon: "https://fastly.jsdelivr.net/gh/xiaolin-007/clash@main/icon/spotify.svg"


  # AI
  - name: "AI"
    type: "url-test"
    include-all: true
    filter: "(?i)AI|GPT"
    interval: 90
    tolerance: 80
    timeout: 5000
    url: "https://www.gstatic.com/generate_204"
